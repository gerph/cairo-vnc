name: Test CairoVNC

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python3:
    name: Python 3.12
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q cairovnc tests example_*.py
